      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .bg-hologram svg {

      height: auto;
      opacity: 0.65;
      filter: drop-shadow(0 0 34px var(--accent-glow));
    }
    .holo-base {
      fill: none;
      stroke: rgba(255, 255, 255, 0.14);
      stroke-width: 3.2;
    }
    .holo-beam {
      fill: none;
      stroke: var(--accent);
      stroke-width: 3.5;
      stroke-linecap: round;
      stroke-dasharray: 155 505;
      animation: holoRun 6.5s linear infinite;
      transition: stroke 0.4s ease;
    }
    @keyframes holoRun {
      0% { stroke-dashoffset: 660; }
      100% { stroke-dashoffset: 0; }
    }

      transition: border-color 0.35s ease, box-shadow 0.35s ease;
